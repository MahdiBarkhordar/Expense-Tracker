<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 46" width="900" height="46" role="img" aria-label="Track every toman, dollar and euro. Budgets that warn you early. Goals with live progress. Your data never leaves your device." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:21px;font-weight:600;fill:#2fb996;text-anchor:middle;opacity:0;animation:cyc 16s infinite both}
    .t2{animation-delay:4s;fill:#3b9cf0}.t3{animation-delay:8s;fill:#8b5cf6}.t4{animation-delay:12s;fill:#e8a317}
    @keyframes cyc{0%{opacity:0;transform:translateY(12px)}4%{opacity:1;transform:none}22%{opacity:1;transform:none}26%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
    .bar{fill:#2fb996;opacity:.35}
  </style>
  <text class="t1" x="450" y="31">Track every toman, dollar &amp; euro.</text>
  <text class="t2" x="450" y="31">Budgets that warn you before you overspend.</text>
  <text class="t3" x="450" y="31">Savings goals with live progress.</text>
  <text class="t4" x="450" y="31">Your data never leaves your device.</text>
</svg>
