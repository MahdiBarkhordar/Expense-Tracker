<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SpendWise</title>
  <desc id="d">Smart income and expense manager</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08101c"/><stop offset="1" stop-color="#0d2b2f"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d3a8"/><stop offset="1" stop-color="#3b9cf0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#34d3a8" stop-opacity=".25"/><stop offset="1" stop-color="#3b9cf0"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#8fb4c9" opacity=".22"/></pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
    .rise{opacity:0;animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .coin{animation:bob 5s ease-in-out infinite alternate}
    .c2{animation-duration:6.5s;animation-delay:-2s}.c3{animation-duration:4.2s;animation-delay:-1s}
    @keyframes bob{to{transform:translateY(-16px) rotate(8deg)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite alternate}
    .b2{animation-delay:-.5s}.b3{animation-delay:-1.1s}.b4{animation-delay:-1.7s}.b5{animation-delay:-2.2s}.b6{animation-delay:-2.8s}
    @keyframes grow{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
    .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 5s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1000}55%,100%{stroke-dashoffset:0}}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle cx="180" cy="60" r="140" fill="#34d3a8"><animate attributeName="cx" values="180;430;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;190;60" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="300" r="160" fill="#3b9cf0"><animate attributeName="cx" values="1030;760;1030" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;300" dur="18s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating coins -->
    <g transform="translate(640 70)"><g class="coin"><circle r="22" fill="none" stroke="#34d3a8" stroke-width="2.5" opacity=".7"/><text y="8" font-size="22" font-weight="700" text-anchor="middle" fill="#34d3a8" opacity=".8">$</text></g></g>
    <g transform="translate(715 280)"><g class="coin c2"><circle r="16" fill="none" stroke="#3b9cf0" stroke-width="2.5" opacity=".7"/><text y="6" font-size="16" font-weight="700" text-anchor="middle" fill="#3b9cf0" opacity=".8">€</text></g></g>
    <g transform="translate(1130 60)"><g class="coin c3"><circle r="18" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity=".7"/><text y="7" font-size="18" font-weight="700" text-anchor="middle" fill="#8b5cf6" opacity=".85">﷼</text></g></g>

    <!-- bars + trend -->
    <g>
      <rect class="bar b1" x="800" y="170" width="34" height="90" rx="7" fill="url(#bar)"/>
      <rect class="bar b2" x="852" y="140" width="34" height="120" rx="7" fill="url(#bar)"/>
      <rect class="bar b3" x="904" y="185" width="34" height="75" rx="7" fill="url(#bar)"/>
      <rect class="bar b4" x="956" y="120" width="34" height="140" rx="7" fill="url(#bar)"/>
      <rect class="bar b5" x="1008" y="150" width="34" height="110" rx="7" fill="url(#bar)"/>
      <rect class="bar b6" x="1060" y="95" width="34" height="165" rx="7" fill="url(#bar)"/>
      <path class="line" d="M817 150 L869 118 L921 160 L973 92 L1025 126 L1077 70" fill="none" stroke="#7ef0d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="pulse" cx="1077" cy="70" r="6" fill="#7ef0d0"/>
      <rect x="790" y="268" width="316" height="2" rx="1" fill="#8fb4c9" opacity=".3"/>
    </g>

    <!-- text -->
    <text class="rise d1" x="68" y="152" font-size="86" font-weight="800" fill="url(#ac)" letter-spacing="-2">SpendWise</text>
    <text class="rise d2" x="72" y="198" font-size="26" fill="#9fb3c8">Smart income &amp; expense manager</text>
    <g class="rise d3">
      <rect x="72" y="232" width="132" height="32" rx="16" fill="#34d3a8" fill-opacity=".14" stroke="#34d3a8" stroke-opacity=".6"/>
      <text x="138" y="253" font-size="12.5" font-weight="700" letter-spacing="1.6" text-anchor="middle" fill="#7ef0d0">LOCAL-FIRST</text>
      <rect x="216" y="232" width="196" height="32" rx="16" fill="#3b9cf0" fill-opacity=".14" stroke="#3b9cf0" stroke-opacity=".6"/>
      <text x="314" y="253" font-size="12.5" font-weight="700" letter-spacing="1.6" text-anchor="middle" fill="#8cc4f7">ZERO DEPENDENCIES</text>
      <rect x="424" y="232" width="160" height="32" rx="16" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".6"/>
      <text x="504" y="253" font-size="13" font-weight="700" text-anchor="middle" fill="#c4b0fb">فارسی · ENGLISH</text>
    </g>
    <text class="rise d4" x="72" y="304" font-size="14" fill="#6f8599" letter-spacing=".5">خرج‌یار — track · budget · save</text>
  </g>
</svg>
