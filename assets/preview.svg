<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Illustrative preview of the SpendWise dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a8"/><stop offset="1" stop-color="#3b9cf0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#34d3a8" stop-opacity=".3"/><stop offset="1" stop-color="#3b9cf0"/></linearGradient>
    <clipPath id="win"><rect width="1000" height="600" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:#e8eef4}
    .mu{fill:#8a9aa8}.sm{font-size:12px}.md{font-size:14px}.lg{font-size:26px;font-weight:800}
    .card{fill:#16202a;stroke:#ffffff1c}
    .pop{opacity:0;animation:pop .7s cubic-bezier(.2,.8,.2,1) forwards}
    .p1{animation-delay:.1s}.p2{animation-delay:.25s}.p3{animation-delay:.4s}.p4{animation-delay:.55s}.p5{animation-delay:.7s}.p6{animation-delay:.85s}
    @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .seg{fill:none;stroke-width:16;animation:dr 8s ease-in-out infinite}
    @keyframes dr{0%{stroke-dasharray:0 251.33}40%,100%{stroke-dasharray:var(--a) 251.33}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.4s ease-in-out infinite alternate}
    .b2{animation-delay:-.5s}.b3{animation-delay:-1s}.b4{animation-delay:-1.5s}.b5{animation-delay:-2s}.b6{animation-delay:-2.5s}
    @keyframes grow{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
    .fill{transform-box:fill-box;transform-origin:left;animation:fw 4s ease-in-out infinite alternate}
    @keyframes fw{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
    .coin{animation:bob 5s ease-in-out infinite alternate}
    @keyframes bob{to{transform:translateY(-10px) rotate(10deg)}}
  </style>
  <g clip-path="url(#win)">
    <rect width="1000" height="600" fill="#0d141b"/>
    <rect width="1000" height="44" fill="#111b24"/>
    <circle cx="26" cy="22" r="6" fill="#ff5f57"/><circle cx="46" cy="22" r="6" fill="#febc2e"/><circle cx="66" cy="22" r="6" fill="#28c840"/>
    <text x="500" y="27" class="sm mu" text-anchor="middle">spendwise · dashboard (illustrative preview)</text>

    <!-- header -->
    <g class="pop p1">
      <rect x="30" y="58" width="32" height="32" rx="9" fill="url(#ac)"/>
      <text x="72" y="79" font-size="17" font-weight="800">SpendWise</text>
      <text x="800" y="79" class="md mu" text-anchor="middle">‹   This month   ›</text>
      <circle cx="950" cy="74" r="15" fill="none" stroke="#ffffff30"/><circle cx="950" cy="74" r="3" fill="#8a9aa8"/>
    </g>

    <!-- hero balance -->
    <g class="pop p2">
      <rect x="30" y="108" width="300" height="150" rx="16" fill="url(#ac)"/>
      <g transform="translate(290 132)" opacity=".2"><g class="coin"><circle r="34" fill="none" stroke="#fff" stroke-width="5"/></g></g>
      <g transform="translate(240 240)" opacity=".2"><g class="coin"><circle r="20" fill="none" stroke="#fff" stroke-width="4"/></g></g>
      <text x="52" y="146" class="sm" style="fill:#ffffffcc">Period balance</text>
      <text x="52" y="196" class="lg" style="font-size:36px;fill:#fff">$4,820.50</text>
    </g>

    <!-- KPIs -->
    <g class="pop p3">
      <rect class="card" x="350" y="108" width="196" height="70" rx="14"/>
      <circle cx="378" cy="143" r="17" fill="#16a34a" fill-opacity=".2"/><path d="M378 151V135M372 141l6-6 6 6" stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="406" y="136" class="sm mu">Income</text><text x="406" y="158" font-size="16" font-weight="700" style="fill:#4ade80">+$6,200</text>
      <rect class="card" x="562" y="108" width="196" height="70" rx="14"/>
      <circle cx="590" cy="143" r="17" fill="#e11d48" fill-opacity=".2"/><path d="M590 135V151M584 145l6 6 6-6" stroke="#fb7185" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="618" y="136" class="sm mu">Expenses</text><text x="618" y="158" font-size="16" font-weight="700" style="fill:#fb7185">−$1,379</text>
      <rect class="card" x="774" y="108" width="196" height="70" rx="14"/>
      <circle cx="802" cy="143" r="17" fill="#3b9cf0" fill-opacity=".2"/><text x="802" y="148" font-size="13" font-weight="700" text-anchor="middle" style="fill:#7cc0ff">%</text>
      <text x="830" y="136" class="sm mu">Savings rate</text><text x="830" y="158" font-size="16" font-weight="700">78%</text>
    </g>

    <!-- smart insights strip -->
    <g class="pop p3">
      <rect class="card" x="350" y="188" width="620" height="70" rx="14"/>
      <text x="372" y="214" class="sm mu">Smart insights</text>
      <text x="372" y="238" class="md">Avg daily spend <tspan font-weight="700" style="fill:#7ef0d0">$46</tspan></text>
      <text x="560" y="238" class="md">Top category <tspan font-weight="700" style="fill:#7ef0d0">Housing</tspan></text>
      <text x="760" y="238" class="md">Projected <tspan font-weight="700" style="fill:#7ef0d0">$1,420</tspan></text>
    </g>

    <!-- donut -->
    <g class="pop p4">
      <rect class="card" x="30" y="274" width="300" height="190" rx="16"/>
      <text x="52" y="304" font-size="14" font-weight="700">Category share</text>
      <g transform="rotate(-90 112 388)">
        <circle cx="112" cy="388" r="40" fill="none" stroke="#ffffff14" stroke-width="16"/>
        <circle class="seg" style="--a:95.5" cx="112" cy="388" r="40" stroke="#34d3a8" stroke-dashoffset="0"/>
        <circle class="seg" style="--a:60.3" cx="112" cy="388" r="40" stroke="#3b9cf0" stroke-dashoffset="-95.5"/>
        <circle class="seg" style="--a:50.3" cx="112" cy="388" r="40" stroke="#8b5cf6" stroke-dashoffset="-155.8"/>
        <circle class="seg" style="--a:45.2" cx="112" cy="388" r="40" stroke="#f59e0b" stroke-dashoffset="-206.1"/>
      </g>
      <g class="sm">
        <circle cx="200" cy="350" r="5" fill="#34d3a8"/><text x="214" y="354">Housing</text><text x="300" y="354" class="mu" text-anchor="end">38%</text>
        <circle cx="200" cy="378" r="5" fill="#3b9cf0"/><text x="214" y="382">Food</text><text x="300" y="382" class="mu" text-anchor="end">24%</text>
        <circle cx="200" cy="406" r="5" fill="#8b5cf6"/><text x="214" y="410">Transport</text><text x="300" y="410" class="mu" text-anchor="end">20%</text>
        <circle cx="200" cy="434" r="5" fill="#f59e0b"/><text x="214" y="438">Fun</text><text x="300" y="438" class="mu" text-anchor="end">18%</text>
      </g>
    </g>

    <!-- trend -->
    <g class="pop p5">
      <rect class="card" x="350" y="274" width="620" height="190" rx="16"/>
      <text x="372" y="304" font-size="14" font-weight="700">Last 6 months</text>
      <rect class="bar b1" x="410" y="370" width="46" height="70" rx="8" fill="url(#bar)"/>
      <rect class="bar b2" x="506" y="350" width="46" height="90" rx="8" fill="url(#bar)"/>
      <rect class="bar b3" x="602" y="378" width="46" height="62" rx="8" fill="url(#bar)"/>
      <rect class="bar b4" x="698" y="335" width="46" height="105" rx="8" fill="url(#bar)"/>
      <rect class="bar b5" x="794" y="358" width="46" height="82" rx="8" fill="url(#bar)"/>
      <rect class="bar b6" x="890" y="322" width="46" height="118" rx="8" fill="url(#bar)"/>
      <g class="sm mu" text-anchor="middle" style="fill:#8a9aa8">
        <text x="433" y="456">May</text><text x="529" y="456">Jun</text><text x="625" y="456">Jul</text><text x="721" y="456">Aug</text><text x="817" y="456">Sep</text><text x="913" y="456">Oct</text>
      </g>
    </g>

    <!-- budgets -->
    <g class="pop p6">
      <rect class="card" x="30" y="480" width="470" height="104" rx="16"/>
      <text x="52" y="506" font-size="14" font-weight="700">Budgets</text>
      <text x="52" y="528" class="sm">Food</text><text x="478" y="528" class="sm mu" text-anchor="end">63%</text>
      <rect x="52" y="534" width="426" height="8" rx="4" fill="#ffffff1a"/>
      <rect class="fill" x="52" y="534" width="268" height="8" rx="4" fill="url(#ac)"/>
      <text x="52" y="562" class="sm">Fun</text><text x="478" y="562" class="sm" text-anchor="end" style="fill:#f59e0b">92% · near limit</text>
      <rect x="52" y="568" width="426" height="8" rx="4" fill="#ffffff1a"/>
      <rect class="fill" x="52" y="568" width="392" height="8" rx="4" fill="#f59e0b"/>
    </g>

    <!-- goals -->
    <g class="pop p6">
      <rect class="card" x="516" y="480" width="454" height="104" rx="16"/>
      <text x="538" y="506" font-size="14" font-weight="700">Savings goals</text>
      <text x="538" y="528" class="sm">Summer trip</text><text x="948" y="528" class="sm mu" text-anchor="end">30%</text>
      <rect x="538" y="534" width="410" height="8" rx="4" fill="#ffffff1a"/>
      <rect class="fill" x="538" y="534" width="123" height="8" rx="4" fill="url(#ac)"/>
      <text x="538" y="562" class="sm">New laptop</text><text x="948" y="562" class="sm mu" text-anchor="end">58%</text>
      <rect x="538" y="568" width="410" height="8" rx="4" fill="#ffffff1a"/>
      <rect class="fill" x="538" y="568" width="238" height="8" rx="4" fill="url(#ac)"/>
    </g>
  </g>
</svg>
